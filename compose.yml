services:
  quantify:
    image: ${QUANTIFY_IMAGE:-docker.local.curiouscoding.dev/quantify:latest}
    user: "${QUANTIFY_UID:-1001}:${QUANTIFY_GID:-1001}"
    restart: unless-stopped
    ports:
      - "${QUANTIFY_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      QUANTIFY_DB_PATH: /app/data/quantify.sqlite
    volumes:
      - "${QUANTIFY_DATA_DIR:-./data/db}:/app/data"