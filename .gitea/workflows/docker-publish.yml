name: Publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Calculate application version from Conventional Commits
        id: version
        shell: bash
        env:
          COMMIT_SHA: ${{ gitea.sha }}
          REF_NAME: ${{ gitea.ref_name }}
        run: |
          set -euo pipefail

          previous_release="$(git describe --tags --match='release-*' --abbrev=0 HEAD 2>/dev/null || true)"
          if [[ -n "$previous_release" ]]; then
            commit_range="${previous_release}..${COMMIT_SHA}"
          else
            commit_range="$COMMIT_SHA"
          fi

          major_pattern='BREAKING[[:space:]]CHANGE|BREAKING-CHANGE|^[[:alnum:]_-]+(\([^)]*\))?!:'
          minor_pattern='^feat(\([^)]*\))?:'
          patch_pattern='^(fix|perf|refactor|revert)(\([^)]*\))?:'

          bump="none"
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            if [[ "$subject" =~ $major_pattern ]]; then
              bump="major"
              break
            elif [[ "$subject" =~ $minor_pattern ]]; then
              bump="minor"
            elif [[ "$subject" =~ $patch_pattern ]] && [[ "$bump" == "none" ]]; then
              bump="patch"
            fi
          done < <(git log --format='%B' "$commit_range")

          current_version="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          semver_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$current_version" =~ $semver_pattern ]]; then
            echo "package.json version must be a stable SemVer value, got $current_version" >&2
            exit 1
          fi

          version_base="$current_version"
          release_version_pattern='release-v?([0-9]+\.[0-9]+\.[0-9]+)'
          if [[ "$previous_release" =~ $release_version_pattern ]]; then
            version_base="${BASH_REMATCH[1]}"
          fi

          IFS=. read -r major minor patch <<< "$version_base"
          case "$bump" in
            major) ((major += 1)); minor=0; patch=0 ;;
            minor) ((minor += 1)); patch=0 ;;
            patch) ((patch += 1)) ;;
            none) echo "No versioned Conventional Commits found in $commit_range"; exit 1 ;;
          esac

          version="$major.$minor.$patch"
          VERSION="$version" bun -e 'const file = Bun.file("package.json"); const packageJson = JSON.parse(await file.text()); packageJson.version = process.env.VERSION; await Bun.write(file, `${JSON.stringify(packageJson, null, 2)}\n`);'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Calculated $version ($bump) from ${previous_release:-repository start} to $REF_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=services

      - name: Load deployment variables
        id: vars
        shell: bash
        run: |
          get_var() {
            sed -n -E "s/^$1:[[:space:]]*//p" .gitea/vars.yml | head -n 1
          }

          echo "registry=$(get_var registry)" >> "$GITHUB_OUTPUT"
          echo "application_name=$(get_var application_name)" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.registry }}/${{ steps.vars.outputs.application_name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit version and tag release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ gitea.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "Gitea Actions"
          git config user.email "gitea-actions@localhost"

          git add package.json
          if git diff --cached --quiet; then
            echo "package.json has no version change to commit" >&2
            exit 1
          fi

          git commit -m "chore(release): release v${RELEASE_VERSION}"
          git tag -a "release-v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}"
          git push origin "HEAD:${REF_NAME}"
          git push origin "release-v${RELEASE_VERSION}"
